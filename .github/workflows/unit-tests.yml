name: Unit tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '55 3 * * 1-5' # Run the build and SonarQube analysis Monday-Friday (UTC).

jobs:
  test:
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Configure NPM with Repox
        uses: SonarSource/ci-github-actions/config-npm@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dist/ is up-to-date
        run: |
          if ! git diff --exit-code dist/ || [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the changes."
            git status --short dist/
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Get SonarQube credentials
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: sonar-secrets
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce # 3.7.0
        with:
          secrets: |
            development/kv/data/sonarcloud url | SONAR_HOST_URL;
            development/kv/data/sonarcloud token | SONAR_TOKEN;

      - name: SonarQube analysis
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./
        env:
          SONAR_HOST_URL: ${{ fromJSON(steps.sonar-secrets.outputs.vault).SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ fromJSON(steps.sonar-secrets.outputs.vault).SONAR_TOKEN }}
        with:
          args: >-
            -Dproject.settings=.sonarcloud.properties
            -Dsonar.projectKey=SonarSource_sonarqube-scan-action
            -Dsonar.organization=sonarsource
